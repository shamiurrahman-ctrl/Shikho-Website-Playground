<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="10" y="18" width="80" height="64" rx="16" fill="#E2335B"/>
  <!-- pulsing play button -->
  <g>
    <circle cx="50" cy="46" r="17" fill="#FFFFFF">
      <animate attributeName="r" values="17;19;17" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M45 38 L60 46 L45 54 Z" fill="#E2335B"/>
  </g>
  <!-- progress bar -->
  <rect x="22" y="70" width="56" height="5" rx="2.5" fill="rgba(255,255,255,.35)"/>
  <rect x="22" y="70" width="6" height="5" rx="2.5" fill="#FFFFFF">
    <animate attributeName="width" values="0;56;56" keyTimes="0;0.85;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="28" cy="72.5" r="4.5" fill="#FFFFFF">
    <animate attributeName="cx" values="22;78;78" keyTimes="0;0.85;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
